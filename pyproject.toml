[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "locus-local"
version = "0.6.0"
description = "Local-first, evidence-led public profile research. No cloud AI."
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "aiohttp>=3.12,<4",
  "beautifulsoup4>=4.13,<5",
  "pydantic>=2.11,<3",
  "ddgs==9.13.0",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pypdf>=6,<7", "pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend/locus"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
